<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Kho Bao Bì — Bản Dùng Thử</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --green:#10b981; --green-d:#059669; --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --sidebar:#0f172a; --sidebar-text:#cbd5e1; --danger:#ef4444; --warn:#f59e0b;
  --input-bg:#ffffff; --hover:#f8fafc; --shadow:0 1px 3px rgba(15,23,42,.08);
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#111c30; --text:#e2e8f0; --muted:#94a3b8; --border:#1e293b;
  --input-bg:#0f1a2e; --hover:#16233c; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(16,185,129,.18)}
a{color:var(--green-d)}
/* ---------- Layout ---------- */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:190px;flex:0 0 190px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.sidebar .brand{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .brand .t1{font-weight:800;font-size:14.5px;color:#fff;line-height:1.25}
.sidebar .brand .t2{font-size:11px;color:#94a3b8;margin-top:2px}
.sidebar nav{flex:1;overflow-y:auto;padding:8px}
.nav-group{margin-bottom:4px}
.nav-group .glabel{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#7c8aa5;padding:8px 8px 4px;text-transform:none;white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--sidebar-text);font-size:13px;font-weight:500;padding:7px 8px;border-radius:8px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--green);color:#fff}
.nav-item svg{width:16px;height:16px;flex:0 0 16px}
.sidebar .foot{padding:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.sidebar .foot .uname{color:#fff;font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:8px 14px}
.topbar .crumb{font-size:12.5px;color:var(--muted)}
.topbar .spacer{flex:1}
.content{padding:16px;max-width:1440px;width:100%;margin:0 auto}
.icon-btn{background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{color:var(--text);background:var(--hover)}
.icon-btn svg{width:17px;height:17px}
#menuBtn{display:none}
.overlay{display:none}
/* ---------- Cards / tables ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card .chead{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .cbody{padding:16px}
.grid{display:grid;gap:14px}
.stat-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.stat{padding:16px}
.stat .sl{font-size:12px;color:var(--muted);font-weight:600}
.stat .sv{font-size:22px;font-weight:800;margin-top:4px}
.stat .ss{font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn .sv{color:var(--warn)} .stat.danger .sv{color:var(--danger)} .stat.green .sv{color:var(--green-d)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--hover)}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:hover td{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-green{background:rgba(16,185,129,.14);color:#059669}.b-gray{background:rgba(100,116,139,.15);color:#64748b}
.b-red{background:rgba(239,68,68,.13);color:#dc2626}.b-amber{background:rgba(245,158,11,.16);color:#b45309}
.b-blue{background:rgba(14,165,233,.14);color:#0284c7}.b-indigo{background:rgba(99,102,241,.14);color:#4f46e5}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.abtn{background:none;border:1px solid var(--border);border-radius:7px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.abtn:hover{color:var(--text);background:var(--hover)}
.abtn svg{width:14px;height:14px}
.abtn.red:hover{color:#dc2626;border-color:#fecaca}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:160px}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:10px 4px 2px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager button{min-width:30px;height:30px;border:1px solid var(--border);background:var(--card);border-radius:7px;color:var(--text);font-size:12.5px;padding:0 6px}
.pager button.on{background:var(--green);color:#fff;border-color:var(--green)}
.pager button:disabled{opacity:.4}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:none;font-size:13.5px;font-weight:600;color:var(--muted);padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--green-d);border-bottom-color:var(--green)}
/* ---------- Forms / modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 10px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:860px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:1060px}
.modal .mhead{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;position:sticky;top:0;background:var(--card);border-radius:14px 14px 0 0;z-index:2}
.modal .mbody{padding:16px 18px}
.modal .mfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.lines-tbl{width:100%;border-collapse:collapse;font-size:13px}
.lines-tbl th{font-size:11.5px;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--border)}
.lines-tbl td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.lines-tbl input{padding:6px 8px}
.combo{position:relative}
.combo .suggest{position:absolute;left:0;right:0;top:calc(100% + 3px);background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:60;max-height:230px;overflow-y:auto;padding:4px}
.combo .suggest button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;background:none;border:none;padding:7px 9px;border-radius:7px;font-size:13px;color:var(--text)}
.combo .suggest button:hover,.combo .suggest button.hl{background:var(--hover)}
.combo .suggest .sc{font-weight:700;white-space:nowrap}
.combo .suggest .sm{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
.totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:13.5px;margin-top:10px}
.totals .trow{display:flex;gap:16px}.totals .trow span:first-child{color:var(--muted)}
.totals .grand{font-size:16px;font-weight:800}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;font-size:13.5px}
.kv .k{color:var(--muted);font-size:11.5px;font-weight:600}
.kv .v{font-weight:600;margin-top:1px}
.section-title{font-weight:700;font-size:13.5px;margin:18px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.toast.err{background:#b91c1c}
/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#0f172a 0%,#123528 100%)}
.login-card{background:var(--card);border-radius:16px;padding:26px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-card h1{font-size:19px;margin:0 0 4px}
.login-card p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login-card .field{margin-bottom:12px}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px}
.demo-note{margin-top:14px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px}
.trial-banner{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
[data-theme="dark"] .trial-banner{background:#2b2110;color:#fcd34d;border-color:#92600e}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{
  body>*{display:none !important}
  body>#printArea{display:block !important}
  #printArea{color:#000;background:#fff;font-size:12px}
  #printArea .print-controls{display:none !important}
}
.sheet{font-family:'Times New Roman',Times,serif;color:#000;padding:6px}
.sheet .co{font-size:12px;line-height:1.35}
.sheet h2{text-align:center;font-size:17px;margin:10px 0 2px;text-transform:uppercase}
.sheet .sub{text-align:center;font-size:12px;margin-bottom:10px}
.sheet table{width:100%;border-collapse:collapse;font-size:12px}
.sheet th,.sheet td{border:1px solid #000;padding:4px 6px}
.sheet th{text-align:center}
.sheet .r{text-align:right}.sheet .c{text-align:center}
.sheet .signs{display:flex;justify-content:space-between;margin-top:22px;text-align:center;font-size:12px;gap:8px}
.sheet .signs div{flex:1}.sheet .signs .sp{height:64px}
.sheet.a5{font-size:10.5px}
.sheet.a5 h2{font-size:14px}
.sheet.a5 table{font-size:10.5px}
.sheet.a5 th,.sheet.a5 td{padding:3px 4px}
.sheet.a5 .signs .sp{height:44px}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .sidebar.open{transform:none}
  .overlay{display:block;position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:35}
  #menuBtn{display:inline-flex}
  .content{padding:12px}
  .fgrid{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>Hệ Thống Quản Lý Kho</h1>
    <p>Kho Bao Bì — bản dùng thử. Đăng nhập để bắt đầu.</p>
    <div class="field">
      <label for="loginUser">Tên đăng nhập</label>
      <input id="loginUser" value="admin" autocomplete="username" />
    </div>
    <div class="field">
      <label for="loginPass">Mật khẩu</label>
      <div class="pw-wrap">
        <input id="loginPass" type="password" value="1234" autocomplete="current-password" />
        <button type="button" id="togglePw">Hiện</button>
      </div>
    </div>
    <div id="loginErr" style="color:#dc2626;font-size:13px;min-height:18px;margin-bottom:6px"></div>
    <button class="btn primary" type="submit" style="width:100%;justify-content:center;padding:10px">Đăng nhập</button>
    <div class="demo-note">Tài khoản dùng thử: <b>admin</b> / <b>1234</b>. Dữ liệu trong bản dùng thử chỉ lưu trên chính máy này, không đồng bộ đi nơi khác.</div>
  </form>
</div>

<div id="app">
  <div class="layout">
    <div class="overlay" id="overlay" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Menu chính">
      <div class="brand">
        <div class="t1">Hệ Thống Quản Lý Kho</div>
        <div class="t2">Kho Bao Bì · Bản dùng thử</div>
      </div>
      <nav id="mainNav" aria-label="Mục chính"></nav>
      <div class="foot">
        <div class="uname" id="footUser">Quản trị viên</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <span style="color:#94a3b8">admin</span>
          <button class="btn sm" id="logoutBtn" style="background:rgba(255,255,255,.08);border-color:transparent;color:#e2e8f0">Đăng xuất</button>
        </div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Mở menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="crumb" id="crumb">Tổng quan</div>
        <div class="spacer"></div>
        <span id="lowStockBadge"></span>
        <button class="icon-btn" id="themeBtn" aria-label="Chuyển chế độ Sáng / Tối"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <div class="content" id="viewRoot"></div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="printArea"></div>
<script>
"use strict";
/* ================= Utils ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN=n=>{n=Number(n)||0;return n.toLocaleString("vi-VN",{maximumFractionDigits:2})};
const fmtMoney=n=>fmtN(n)+" đ";
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{if(!s)return "—";const p=String(s).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s};
const fold=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const ONES=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function read3(n,full){let s="";const tr=Math.floor(n/100),ch=Math.floor(n%100/10),dv=n%10;
  if(full||tr>0){s+=ONES[tr]+" trăm";if(ch===0&&dv>0)s+=" linh"}
  if(ch>1){s+=" "+ONES[ch]+" mươi";if(dv===1)s+=" mốt"}
  else if(ch===1){s+=" mười"}
  if(dv>0&&ch!==1){if(ch>1&&dv===5)s+=" lăm";else if(!(ch>1&&dv===1))s+=" "+ONES[dv]}
  else if(dv===5&&ch===1)s+=" lăm";
  return s.trim()}
function moneyWords(n){n=Math.round(Number(n)||0);if(n===0)return "Không đồng";
  const units=["","nghìn","triệu","tỷ","nghìn tỷ","triệu tỷ"];let parts=[],i=0;
  while(n>0){const g=n%1000;if(g>0)parts.unshift(read3(g,i>0)+" "+units[i]);n=Math.floor(n/1000);i++}
  const s=parts.join(" ").trim();return s.charAt(0).toUpperCase()+s.slice(1)+" đồng"}
/* ================= Icons (inline SVG) ================= */
const P={
chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round"/>',
box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/>',
wh:'<path d="M3 21V9l9-6 9 6v12M7 21v-8h10v8M7 17h10"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5M16 5.5a3.5 3.5 0 0 1 0 6M17.5 15.3c2 .6 3.5 2.2 4 4.7"/>',
clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0M9 11h6M9 15h4"/>',
down:'<path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
up:'<path d="M12 13V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
swap:'<path d="M4 7h13m0 0l-3.5-3.5M17 7l-3.5 3.5M20 17H7m0 0l3.5 3.5M7 17l3.5-3.5"/>',
file:'<path d="M6 2h8l4 4v16H6zM14 2v4h4M9 12h6M9 16h6"/>',
truck:'<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7z"/><circle cx="6.5" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
cubes:'<path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2zM4 6.5L12 11l8-4.5M12 11v9"/>',
coins:'<circle cx="9" cy="9" r="6"/><path d="M14.5 5.5A6 6 0 1 1 9 21a6 6 0 0 1-3.4-1"/>',
report:'<path d="M6 2h8l4 4v16H6zM14 2v4h4M9 17v-4M12 17V8M15 17v-6"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',

function nextCode(kind){DB.seq[kind]=(DB.seq[kind]||0)+1;return kind+String(DB.seq[kind]).padStart(5,"0")}
/* stock derived from approved vouchers */
function stockMap(){const m={};DB.txs.forEach(t=>{if(t.status!=="approved")return;
 t.lines.forEach(l=>{const q=Number(l.qty)||0;
  if(t.type==="import"){const k=t.warehouseId+"|"+l.productId;m[k]=(m[k]||0)+q}
  else if(t.type==="export"){const k=t.warehouseId+"|"+l.productId;m[k]=(m[k]||0)-q}
  else if(t.type==="transfer"){const a=t.warehouseId+"|"+l.productId,b=t.toWarehouseId+"|"+l.productId;m[a]=(m[a]||0)-q;m[b]=(m[b]||0)+q}})});
 return m}
function stockOf(whId,pid){return stockMap()[whId+"|"+pid]||0}
function txTotal(t){return t.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0)}
function docTotal(d){return d.lines.reduce((s,l)=>s+(Number(l.qty)||0)*(Number(l.price)||0),0)-(Number(d.discount)||0)}
/* debts from approved vouchers + payments */
function partnerDebt(pid){let debt=0; // >0 partner owes us (customer), <0 we owe partner (supplier shown separately)
 let receivable=0,payable=0;
 DB.txs.forEach(t=>{if(t.status!=="approved"||t.partnerId!==pid)return;const tot=txTotal(t),paid=Number(t.paidAmount)||0;
  if(t.type==="export")receivable+=tot-paid; if(t.type==="import")payable+=tot-paid});
 DB.payments.forEach(pm=>{if(pm.partnerId!==pid)return;if(pm.kind==="receipt")receivable-=Number(pm.amount)||0;else payable-=Number(pm.amount)||0});
 return{receivable,payable}}

function comboInput(inp,kind){const box=inp.parentElement.querySelector(".suggest");const q=fold(inp.value.trim());
 let items=[];
 if(kind==="partner"){items=DB.partners.filter(p=>p.type!=="supplier").filter(p=>!q||fold(p.name).includes(q)||fold(p.code).includes(q)||fold(p.phone).includes(q)).slice(0,9)
   .map(p=>({pick:p.id,main:p.name,sub:p.code+(p.phone?" · "+p.phone:"")}));}
 else if(kind==="partnerAny"){items=DB.partners.filter(p=>!q||fold(p.name).includes(q)||fold(p.code).includes(q)||fold(p.phone).includes(q)).slice(0,9)
   .map(p=>({pick:p.id,main:p.name,sub:p.code+(p.phone?" · "+p.phone:"")}));}
 else if(kind==="product"){items=allProducts().filter(p=>!q||fold(p.name).includes(q)||fold(p.code).includes(q)).slice(0,9)
   .map(p=>({pick:p.id,main:p.name,sub:p.code+" · "+p.unit+" · "+fmtMoney(kind==="productCost"?p.cost:p.price)}));}
 else if(kind==="productCost"){items=allProducts().filter(p=>!q||fold(p.name).includes(q)||fold(p.code).includes(q)).slice(0,9)
   .map(p=>({pick:p.id,main:p.name,sub:p.code+" · "+p.unit+" · "+fmtMoney(p.cost)}));}
 if(!items.length){box.hidden=true;comboCtx=null;return}
 box.innerHTML=items.map((it,i)=>'<button type="button" data-i="'+i+'"><span class="sc">'+esc(it.main)+'</span><span class="sm">'+esc(it.sub)+"</span></button>").join("");
 box.hidden=false;comboCtx={inp,box,items,hl:-1};
 $$("button",box).forEach((b,i)=>b.addEventListener("mousedown",e=>{e.preventDefault();pickCombo(i)}));
 document.removeEventListener("keydown",comboKeys);document.addEventListener("keydown",comboKeys)}
function pickCombo(i){if(!comboCtx)return;const it=comboCtx.items[i];if(!it)return;const inp=comboCtx.inp;
 inp.value=it.main;inp.dataset.pick=it.pick;comboCtx.box.hidden=true;comboCtx=null;
 inp.dispatchEvent(new Event("combo-picked",{bubbles:true}))}
function comboKeys(e){if(!comboCtx)return;const items=comboCtx.items;
 if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();comboCtx.hl=e.key==="ArrowDown"?Math.min(comboCtx.hl+1,items.length-1):Math.max(comboCtx.hl-1,0);
  $$("button",comboCtx.box).forEach((b,i)=>b.classList.toggle("hl",i===comboCtx.hl))}
 else if(e.key==="Enter"&&comboCtx.hl>=0){e.preventDefault();pickCombo(comboCtx.hl)}
 else if(e.key==="Escape"){comboCtx.box.hidden=true;comboCtx=null}}
function comboBlur(inp){setTimeout(()=>{const box=inp.parentElement.querySelector(".suggest");if(box)box.hidden=true;comboCtx=null},150)}
/* resolve a partner typed in a combo: existing pick, exact-name match, or create new customer */
function resolvePartner(inp,allowCreate){const pick=inp.dataset.pick;if(pick)return partnerById(pick)||null;
 const name=inp.value.trim();if(!name)return null;
 const found=DB.partners.find(p=>p.type!=="supplier"&&fold(p.name)===fold(name));if(found)return found;
 if(!allowCreate)return null;

 DB.partners.push(np);logAct("Thêm đối tượng","Tạo nhanh khách "+np.code+" — "+name+" (khi lập chứng từ bán hàng)");return np}

function collectLines(){const out=[];let bad=0;

  if(!p){bad=i+1;return}
  if(!(Number(l.qty)>0))return;

 return{lines:out,bad}}

let stockWh="",stockQ="",stockFrom="",stockTo="",stockMode="all";
/* Báo cáo Xuất – Nhập – Tồn: tính từ phiếu ĐÃ DUYỆT.
   Tồn đầu = phát sinh trước "Từ ngày"; Nhập/Xuất = phát sinh trong kỳ; Tồn cuối = Tồn đầu + Nhập − Xuất.
   Không chọn ngày = toàn bộ thời gian (Tồn đầu = 0). Danh sách luôn hiện TOÀN BỘ sản phẩm, kể cả tồn = 0. */
function nxtCalc(){const whSet=stockWh?{[stockWh]:1}:null;const inWh=id=>!whSet||whSet[id];
 const byProd={},byWh={};
 function acc(pid,whId,when,delta,nhap,xuat){const k=String(pid);
  if(!byProd[k])byProd[k]={dau:0,nhap:0,xuat:0,cuoi:0};
  if(!byWh[k])byWh[k]={};
  if(when==="before"){byProd[k].dau+=delta;byWh[k][whId]=(byWh[k][whId]||0)+delta}
  else if(when==="in"){byProd[k].nhap+=nhap;byProd[k].xuat+=xuat;byWh[k][whId]=(byWh[k][whId]||0)+delta}}
 DB.txs.forEach(t=>{if(t.status!=="approved")return;const d=String(t.date||"").slice(0,10);
  const period=(stockFrom&&d&&d<stockFrom)?"before":(stockTo&&d&&d>stockTo)?"skip":"in";
  if(period==="skip")return;
  t.lines.forEach(l=>{const q=Number(l.qty)||0;if(!q)return;
   if(t.type==="import"){if(inWh(t.warehouseId))acc(l.productId,t.warehouseId,period,q,q,0)}
   else if(t.type==="export"){if(inWh(t.warehouseId))acc(l.productId,t.warehouseId,period,-q,0,q)}
   else if(t.type==="transfer"){if(inWh(t.warehouseId))acc(l.productId,t.warehouseId,period,-q,0,q);if(inWh(t.toWarehouseId))acc(l.productId,t.toWarehouseId,period,q,q,0)}})});
 Object.keys(byProd).forEach(k=>{byProd[k].cuoi=byProd[k].dau+byProd[k].nhap-byProd[k].xuat});
 return{byProd,byWh}}
function stockRows(){const nx=nxtCalc();
 let rows=allProducts().map(p=>{const n=nx.byProd[String(p.id)]||{dau:0,nhap:0,xuat:0,cuoi:0};
  return{p,dau:n.dau,nhap:n.nhap,xuat:n.xuat,tot:n.cuoi,byWh:nx.byWh[String(p.id)]||{}}});
 rows=rows.filter(x=>!stockQ||fold(x.p.name).includes(fold(stockQ))||fold(x.p.code).includes(fold(stockQ)));
 if(stockMode==="stock")rows=rows.filter(x=>x.tot!==0);
 else if(stockMode==="move")rows=rows.filter(x=>x.nhap!==0||x.xuat!==0);
 return rows}

 "</div>"+

function stockDetail(pid){const p=prodById(pid);if(!p)return;
 const whName=id=>{const w=whById(id);return w?esc(w.code+" — "+w.name):"—"};
 let tin=0,tout=0;const lines=[];
 DB.txs.filter(t=>t.status==="approved").slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>{
  t.lines.forEach(l=>{if(String(l.productId)!==String(pid))return;const q=Number(l.qty)||0;
   if(t.type==="import"){tin+=q;lines.push({t,wh:t.warehouseId,nhap:q,xuat:0,label:"Nhập kho"})}
   else if(t.type==="export"){tout+=q;lines.push({t,wh:t.warehouseId,nhap:0,xuat:q,label:"Xuất kho"})}
   else if(t.type==="transfer"){tout+=q;tin+=q;lines.push({t,wh:t.warehouseId,nhap:0,xuat:q,label:"Chuyển ra"});lines.push({t,wh:t.toWarehouseId,nhap:q,xuat:0,label:"Chuyển vào"})}})});
 const sm=stockMap();let cur=0;DB.warehouses.forEach(w=>cur+=sm[w.id+"|"+pid]||0);
 openModal(mHead("Chi tiết xuất nhập tồn — "+p.code)+'<div class="mbody">'+
 '<div class="kv"><div><div class="k">Sản phẩm</div><div class="v">'+esc(p.name)+'</div></div><div><div class="k">Đơn vị tính</div><div class="v">'+esc(p.unit)+'</div></div><div><div class="k">Tổng nhập (đã duyệt)</div><div class="v" style="color:#059669">'+fmtN(tin)+'</div></div><div><div class="k">Tổng xuất (đã duyệt)</div><div class="v" style="color:#dc2626">'+fmtN(tout)+'</div></div><div><div class="k">Tồn hiện tại (tất cả kho)</div><div class="v">'+fmtN(cur)+"</div></div></div>"+
 '<div class="section-title">Từng phiếu phát sinh</div>'+
 (lines.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Số phiếu</th><th>Loại</th><th>Kho</th><th class="num">Nhập</th><th class="num">Xuất</th><th class="num">Đơn giá</th></tr></thead><tbody>'+
  lines.map(x=>"<tr><td>"+fmtDate(x.t.date)+"</td><td><b>"+esc(x.t.code)+"</b></td><td>"+x.label+"</td><td>"+whName(x.wh)+'</td><td class="num">'+(x.nhap?fmtN(x.nhap):"—")+'</td><td class="num">'+(x.xuat?fmtN(x.xuat):"—")+'</td><td class="num">'+fmtMoney(x.t.lines.find(l=>String(l.productId)===String(pid))?.price||0)+"</td></tr>").join("")+"</tbody></table></div>"
 :'<div class="empty">Sản phẩm này chưa có phiếu nhập / xuất nào được duyệt. Lập phiếu ở mục Nhập kho / Xuất kho và duyệt phiếu thì phát sinh sẽ hiện tại đây.</div>')+
 '</div><div class="mfoot"><button class="btn" onclick="closeModal()">Đóng</button></div>',true)}
function exportStockCSV(){const rows=stockRows();const whCols=DB.warehouses.filter(w=>!stockWh||w.id===stockWh);
 const out=[["Mã hàng","Tên sản phẩm","Nhóm","ĐVT","Tồn đầu","Nhập trong kỳ","Xuất trong kỳ","Tồn cuối",...whCols.map(w=>"Tồn tại "+w.code),"Giá trị tồn (giá vốn)"]];
 rows.forEach(x=>out.push([x.p.code,x.p.name,x.p.cat||"Bao bì",x.p.unit,x.dau,x.nhap,x.xuat,x.tot,...whCols.map(w=>x.byWh[w.id]||0),Math.round(x.tot*(Number(x.p.cost)||0))]));
 downloadCSV("xuat-nhap-ton.csv",out);toast("Đã tải file CSV báo cáo Xuất Nhập Tồn ("+rows.length+" sản phẩm).")}

<script>
"use strict";
/* ================= Sales: Báo giá / Đơn hàng / Hóa đơn ================= */
const DOC_STATUS={quote:{draft:["Nháp","b-gray"],sent:["Đã gửi","b-blue"],accepted:["Khách đồng ý","b-green"],rejected:["Khách từ chối","b-red"],converted:["Đã thành đơn hàng","b-indigo"],cancelled:["Đã hủy","b-red"]},
 order:{draft:["Nháp","b-gray"],confirmed:["Đã xác nhận","b-green"],fulfilled:["Đã xuất kho","b-indigo"],cancelled:["Đã hủy","b-red"]},

let docQ="",docStatusFilter="";
function vOrders(r){
 const tabs='<div class="tabs"><button class="'+(salesTab==="orders"?"on":"")+'" onclick="salesSetTab(\'orders\')">Đơn hàng</button><button class="'+(salesTab==="quotes"?"on":"")+'" onclick="salesSetTab(\'quotes\')">Báo giá</button></div>';
 const kind=salesTab==="orders"?"order":"quote";
 let rows=DB.docs.filter(d=>d.kind===kind).filter(d=>(!docStatusFilter||d.status===docStatusFilter)&&(!docQ||fold(d.code).includes(fold(docQ))||fold(partnerById(d.partnerId)?.name||"").includes(fold(docQ))));
 const pg=paginate("doc",rows,15);
 const statuses=Object.keys(DOC_STATUS[kind]);
 r.innerHTML=tabs+'<div class="card"><div class="chead">'+docKindLabel(kind)+' <span class="badge b-gray">'+rows.length+'</span><span style="flex:1"></span><button class="btn sm" onclick="exportDocsCSV(\''+kind+'\')">Xuất Excel (CSV)</button> <button class="btn primary sm" onclick="docForm(\''+kind+'\')">+ Tạo '+(kind==="order"?"đơn hàng":"báo giá")+"</button></div><div class=\"cbody\">"+
 '<div class="toolbar"><div class="grow"><input id="docSearch" placeholder="Tìm theo số chứng từ, khách hàng…" value="'+esc(docQ)+'"></div>'+
 '<select id="docStatus" style="width:auto"><option value="">Tất cả trạng thái</option>'+statuses.map(s=>'<option value="'+s+'" '+(docStatusFilter===s?"selected":"")+">"+DOC_STATUS[kind][s][0]+"</option>").join("")+"</select></div>"+
 '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Số</th><th>Ngày</th>'+(kind==="quote"?'<th>Hiệu lực đến</th>':"")+'<th>Khách hàng</th><th class="num">Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+
 (pg.pageRows.map(d=>"<tr><td><b>"+esc(d.code)+"</b></td><td>"+fmtDate(d.date)+"</td>"+(kind==="quote"?"<td>"+fmtDate(d.validUntil)+"</td>":"")+"<td>"+esc(partnerById(d.partnerId)?.name||"Khách lẻ")+'</td><td class="num">'+fmtMoney(docTotal(d))+"</td><td>"+docBadge(d)+'</td><td><div class="row-actions"><button class="abtn" title="Xem" onclick="docDetail(\''+d.id+'\')">'+EYE+"</button>"+
  (["draft","sent"].includes(d.status)?'<button class="abtn" title="Sửa" onclick="docForm(\''+kind+"','"+d.id+'\')">'+PEN+"</button>":"")+
  '<button class="abtn" title="In" onclick="printDoc(\''+d.id+'\')">'+PRINT+"</button>"+
  (d.status==="draft"?'<button class="abtn red" onclick="deleteDoc(\''+d.id+"')\">"+TRASH+"</button>":"")+"</div></td></tr>").join("")||'<tr><td colspan="7"><div class="empty">Chưa có '+(kind==="order"?"đơn hàng":"báo giá")+' nào.</div></td></tr>')+
 "</tbody></table></div>"+pagerHTML("doc",pg,"docPage")+"</div></div>";
 const s=$("#docSearch");s.addEventListener("input",e=>{docQ=e.target.value;setPage("doc",1);const v=e.target.value,pos=e.target.selectionStart;render();const n=$("#docSearch");n.focus();n.setSelectionRange(pos,pos)});
 $("#docStatus").addEventListener("change",e=>{docStatusFilter=e.target.value;setPage("doc",1);render()})}
function salesSetTab(t){salesTab=t;docStatusFilter="";setPage("doc",1);render()}
function docPage(p){setPage("doc",p);render()}
function exportDocsCSV(kind){const rows=[["Số","Ngày","Khách hàng","Tổng tiền","Trạng thái"]];
 DB.docs.filter(d=>d.kind===kind).forEach(d=>rows.push([d.code,fmtDate(d.date),partnerById(d.partnerId)?.name||"Khách lẻ",docTotal(d),(DOC_STATUS[kind][d.status]||[])[0]||d.status]));
 downloadCSV((kind==="order"?"don-hang":"bao-gia")+".csv",rows)}
function deleteDoc(id){const d=DB.docs.find(x=>x.id===id);askConfirm("Xóa chứng từ","Xóa "+d.code+"?",()=>{DB.docs=DB.docs.filter(x=>x.id!==id);logAct("Xóa chứng từ",d.code);save();render()})}
/* ---- sales doc form ---- */
let docQuoteSource=null; // quote id chosen in order form
function docForm(kind,editId,fromQuoteId){const d=editId?DB.docs.find(x=>x.id===editId):null;
 docQuoteSource=null;
 let srcQuote=fromQuoteId?DB.docs.find(x=>x.id===fromQuoteId):null;
 if(!d&&kind==="order"&&srcQuote){docQuoteSource=srcQuote.id}
 const base=d||srcQuote||null;
 formLines=base?base.lines.map(l=>Object.assign({},l,{name:prodById(l.productId)?.name||""})):[{productId:"",name:"",qty:"",unit:"",price:""}];
 const openQuotes=DB.docs.filter(x=>x.kind==="quote"&&["draft","sent","accepted"].includes(x.status));
 openModal(mHead((d?"Sửa ":"Tạo ")+(kind==="order"?"đơn hàng mới":"báo giá mới"))+'<form id="docForm"><input type="hidden" id="docf-kind" value="'+kind+'"><div class="mbody">'+
 (!d&&kind==="order"?'<div class="card" style="box-shadow:none;margin-bottom:12px"><div class="cbody" style="padding:12px"><div class="field"><label>Tạo đơn từ báo giá (không bắt buộc)</label><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="docQuoteSel" style="flex:1;min-width:220px"><option value="">— Không chọn báo giá —</option>'+openQuotes.map(q=>'<option value="'+q.id+'" '+(srcQuote&&srcQuote.id===q.id?"selected":"")+">"+esc(q.code+" · "+(partnerById(q.partnerId)?.name||"Khách lẻ")+" · "+fmtMoney(docTotal(q)))+"</option>").join("")+'</select><button type="button" class="btn" id="viewQuoteBtn" '+(srcQuote?"":"disabled")+'>Xem báo giá</button></div><div class="hint" style="font-size:11.5px;color:var(--muted);margin-top:4px">Chọn báo giá để nạp sẵn khách, chiết khấu và dòng hàng.</div></div></div></div>':"")+
 '<div class="fgrid">'+
 '<div class="field"><label>Ngày *</label><input id="docf-date" type="date" value="'+(d?d.date:todayStr())+'" required></div>'+
 (kind==="quote"?'<div class="field"><label>Hiệu lực đến</label><input id="docf-valid" type="date" value="'+(d?d.validUntil||"":"")+'"></div>':"")+
 '<div class="field"><label>Khách hàng (gõ tên — khách mới sẽ tự được thêm)</label>'+comboHTML("docf-partner",base?partnerById(base.partnerId)?.name||"":"","Gõ tên khách hàng…","partner")+"</div>"+
 '<div class="field"><label>Chiết khấu (đ)</label><input id="docDiscount" type="number" min="0" step="any" value="'+(base?base.discount||0:0)+'"></div>'+
 '<div class="field full"><label>Ghi chú</label><input id="docf-note" value="'+esc(base?(base.note||""):"")+'"></div>'+
 '</div><div class="section-title">Dòng hàng</div>'+
 '<div class="tbl-wrap"><table class="lines-tbl"><thead><tr><th>Mặt hàng *</th><th>Số lượng</th><th>ĐVT</th><th>Đơn giá bán</th><th style="text-align:right">Thành tiền</th><th></th></tr></thead><tbody id="lineRows"></tbody></table></div>'+
 '<button type="button" class="btn sm" onclick="addLine(\'sales\')">+ Thêm dòng</button>'+
 '<div class="totals"><div class="trow"><span>Cộng tiền hàng:</span><span id="formTotal">0 đ</span></div><div class="trow grand"><span>Tổng thanh toán:</span><span id="docGrand">0 đ</span></div></div>'+
 '</div><div class="mfoot"><button type="button" class="btn" onclick="closeModal()">Hủy</button>'+
 (kind==="order"&&!d?'<button class="btn" type="button" id="saveAndInvoiceBtn">Lưu &amp; xuất hóa đơn</button>':"")+
 '<button class="btn primary" type="submit">Lưu '+(kind==="order"?"đơn hàng":"báo giá")+"</button></div></form>",true);
 renderLineRows("sales");
 $("#docDiscount").addEventListener("input",updateFormTotal);updateFormTotal();
 const qSel=$("#docQuoteSel");
 if(qSel){qSel.addEventListener("change",()=>{const q=DB.docs.find(x=>x.id===qSel.value);$("#viewQuoteBtn").disabled=!q;
   if(q){docQuoteSource=q.id;const pin=$("#docf-partner");pin.value=partnerById(q.partnerId)?.name||"";pin.dataset.pick=q.partnerId||"";
    $("#docDiscount").value=q.discount||0;$("#docf-note").value=q.note||"";
    formLines=q.lines.map(l=>Object.assign({},l,{name:prodById(l.productId)?.name||""}));renderLineRows("sales");$("#docDiscount").addEventListener("input",updateFormTotal);updateFormTotal()}
   else docQuoteSource=null});
  $("#viewQuoteBtn").addEventListener("click",()=>{if(docQuoteSource)quoteQuickView(docQuoteSource)})}
 $("#docForm").addEventListener("submit",e=>{e.preventDefault();saveDocForm(kind,d,false)});
 const sai=$("#saveAndInvoiceBtn");if(sai)sai.addEventListener("click",()=>saveDocForm(kind,d,true))}
function quoteQuickView(id){const q=DB.docs.find(x=>x.id===id);if(!q)return;
 openModal(mHead("Báo giá "+q.code)+'<div class="mbody"><div class="kv"><div><div class="k">Khách hàng</div><div class="v">'+esc(partnerById(q.partnerId)?.name||"Khách lẻ")+'</div></div><div><div class="k">Ngày</div><div class="v">'+fmtDate(q.date)+'</div></div><div><div class="k">Hiệu lực đến</div><div class="v">'+fmtDate(q.validUntil)+'</div></div><div><div class="k">Trạng thái</div><div class="v">'+docBadge(q)+"</div></div></div>"+
 '<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Tên hàng</th><th>ĐVT</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead><tbody>'+
 q.lines.map(l=>{const p=prodById(l.productId);return "<tr><td>"+esc(p?p.name:"")+"</td><td>"+esc(l.unit||"")+'</td><td class="num">'+fmtN(l.qty)+'</td><td class="num">'+fmtMoney(l.price)+'</td><td class="num">'+fmtMoney(l.qty*l.price)+"</td></tr>"}).join("")+
 '</tbody></table></div><div class="totals"><div class="trow"><span>Chiết khấu:</span><span>'+fmtMoney(q.discount||0)+'</span></div><div class="trow grand"><span>Tổng:</span><span>'+fmtMoney(docTotal(q))+'</span></div></div></div><div class="mfoot"><button class="btn" onclick="printDoc(\''+q.id+'\')">In báo giá</button><button class="btn primary" onclick="closeModal();docForm(\'order\',null,\''+q.id+'\')">Tạo đơn hàng từ báo giá này</button><button class="btn" onclick="closeModal()">Đóng</button></div>',true)}
function saveDocForm(kind,d,withInvoice){const{lines,bad}=collectLines();
 if(bad){toast("Dòng "+bad+" chưa chọn đúng sản phẩm trong gợi ý.",true);return}
 if(!lines.length){toast("Chứng từ cần ít nhất 1 dòng hàng có số lượng.",true);return}
 const pin=$("#docf-partner");const partner=pin.value.trim()?resolvePartner(pin,true):null;
 const discount=Number($("#docDiscount").value)||0;
 const sub=lines.reduce((s,l)=>s+l.qty*l.price,0);if(discount>sub){toast("Chiết khấu vượt tổng tiền hàng.",true);return}
 const data={date:$("#docf-date").value,partnerId:partner?partner.id:"",discount,note:$("#docf-note").value.trim(),lines};
 if(kind==="quote")data.validUntil=$("#docf-valid").value||"";
 if(d){Object.assign(d,data);logAct("Sửa chứng từ",d.code);save();closeModal();render();toast("Đã lưu "+d.code)}
 else{const code=nextCode(kind==="quote"?"BG":kind==="order"?"DH":"HD");
  const nd=Object.assign({id:uid(),code,kind,status:"draft",sourceId:"",exportTxId:""},data);
  if(kind==="order"&&docQuoteSource){const q=DB.docs.find(x=>x.id===docQuoteSource);
   if(q&&["draft","sent","accepted"].includes(q.status)){nd.sourceId=q.id;q.status="converted";logAct("Chuyển báo giá thành đơn hàng",q.code+" → "+code)}
   else if(q){toast("Báo giá đã được chuyển hoặc đã đóng, không dùng lại được.",true);return}}
  DB.docs.unshift(nd);logAct("Lập "+docKindLabel(kind).toLowerCase(),code);save();closeModal();
  if(withInvoice&&kind==="order"){const inv=convertDoc(nd.id,"invoice");if(inv){render();printDoc(inv.id);return}}
  render();docDetail(nd.id);toast("Đã tạo "+code)}}
/* conversions */
function convertDoc(id,target){const src=DB.docs.find(x=>x.id===id);if(!src)return null;
 if(target==="invoice"){
  const exist=DB.docs.find(x=>x.kind==="invoice"&&x.sourceId===src.id&&x.status!=="cancelled");
  if(exist){toast("Chứng từ này đã có hóa đơn đang hiệu lực ("+exist.code+").",true);return null}
  const inv={id:uid(),code:nextCode("HD"),kind:"invoice",status:"issued",date:todayStr(),partnerId:src.partnerId,discount:src.discount||0,note:src.note||"",validUntil:"",sourceId:src.id,exportTxId:"",lines:src.lines.map(l=>Object.assign({},l))};
  DB.docs.unshift(inv);logAct("Xuất hóa đơn nội bộ",src.code+" → "+inv.code);save();return inv}
 if(target==="order"){if(src.kind!=="quote")return null;
  if(!["draft","sent","accepted"].includes(src.status)){toast("Báo giá không còn mở để chuyển thành đơn hàng.",true);return null}
  const o={id:uid(),code:nextCode("DH"),kind:"order",status:"draft",date:todayStr(),partnerId:src.partnerId,discount:src.discount||0,note:src.note||"",validUntil:"",sourceId:src.id,exportTxId:"",lines:src.lines.map(l=>Object.assign({},l))};
  src.status="converted";DB.docs.unshift(o);logAct("Chuyển báo giá thành đơn hàng",src.code+" → "+o.code);save();return o}
 if(target==="quote"){const q={id:uid(),code:nextCode("BG"),kind:"quote",status:"draft",date:todayStr(),partnerId:src.partnerId,discount:src.discount||0,note:src.note||"",validUntil:"",sourceId:src.id,exportTxId:"",lines:src.lines.map(l=>Object.assign({},l))};
  DB.docs.unshift(q);logAct("Lập báo giá từ đơn hàng",src.code+" → "+q.code);save();return q}
 return null}
function setDocStatus(id,status){const d=DB.docs.find(x=>x.id===id);d.status=status;logAct("Đổi trạng thái chứng từ",d.code+" → "+((DOC_STATUS[d.kind][status]||[])[0]||status));save();docDetail(id);render()}
/* ---- order detail with Báo giá + Hóa đơn sections ---- */
function docDetail(id){const d=DB.docs.find(x=>x.id===id);if(!d)return;
 const srcQuote=d.sourceId&&DB.docs.find(x=>x.id===d.sourceId&&x.kind==="quote")?DB.docs.find(x=>x.id===d.sourceId):null;
 const childQuotes=DB.docs.filter(x=>x.kind==="quote"&&x.sourceId===d.id);
 const invoices=DB.docs.filter(x=>x.kind==="invoice"&&x.sourceId===d.id);
 const exportTx=d.exportTxId?DB.txs.find(x=>x.id===d.exportTxId):null;
 let actions="";
 if(d.kind==="quote"){
  if(d.status==="draft")actions+='<button class="btn" onclick="setDocStatus(\''+d.id+'\',\'sent\')">Gửi khách</button>';
  if(d.status==="sent")actions+='<button class="btn" onclick="setDocStatus(\''+d.id+'\',\'accepted\')">Khách đồng ý</button><button class="btn" onclick="setDocStatus(\''+d.id+'\',\'rejected\')">Khách từ chối</button>';
  if(["draft","sent","accepted"].includes(d.status))actions+='<button class="btn primary" onclick="convertAndOpen(\''+d.id+'\',\'order\')">Chuyển thành đơn hàng</button><button class="btn" onclick="convertAndOpen(\''+d.id+'\',\'invoice\')">Xuất hóa đơn nội bộ</button>';
  if(!["converted","cancelled"].includes(d.status))actions+='<button class="btn" onclick="setDocStatus(\''+d.id+'\',\'cancelled\')">Hủy báo giá</button>'}
 if(d.kind==="order"){
  if(d.status==="draft")actions+='<button class="btn primary" onclick="setDocStatus(\''+d.id+'\',\'confirmed\')">Xác nhận đơn</button>';
  if(["draft","confirmed"].includes(d.status)&&!d.exportTxId)actions+='<button class="btn" onclick="createExportFromOrder(\''+d.id+'\')">Tạo phiếu xuất kho</button>';
  if(["draft","confirmed"].includes(d.status)&&!invoices.some(i=>i.status!=="cancelled"))actions+='<button class="btn" onclick="convertAndOpen(\''+d.id+'\',\'invoice\')">Xuất hóa đơn nội bộ</button>';
  if(d.status!=="cancelled"&&d.status!=="fulfilled")actions+='<button class="btn" onclick="setDocStatus(\''+d.id+'\',\'cancelled\')">Hủy đơn</button>'}
 openModal(mHead(docKindLabel(d.kind)+" "+d.code)+'<div class="mbody">'+
 '<div class="kv"><div><div class="k">Ngày</div><div class="v">'+fmtDate(d.date)+'</div></div>'+
 (d.kind==="quote"?'<div><div class="k">Hiệu lực đến</div><div class="v">'+fmtDate(d.validUntil)+"</div></div>":"")+
 '<div><div class="k">Khách hàng</div><div class="v">'+esc(partnerById(d.partnerId)?.name||"Khách lẻ")+'</div></div>'+
 '<div><div class="k">Trạng thái</div><div class="v">'+docBadge(d)+'</div></div>'+
 '<div><div class="k">Ghi chú</div><div class="v">'+esc(d.note||"—")+"</div></div></div>"+
 '<div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Mã hàng</th><th>Tên hàng</th><th>ĐVT</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead><tbody>'+
 d.lines.map(l=>{const p=prodById(l.productId);return "<tr><td>"+esc(p?p.code:"")+"</td><td>"+esc(p?p.name:"")+"</td><td>"+esc(l.unit||"")+'</td><td class="num">'+fmtN(l.qty)+'</td><td class="num">'+fmtMoney(l.price)+'</td><td class="num">'+fmtMoney(l.qty*l.price)+"</td></tr>"}).join("")+
 '</tbody></table></div><div class="totals"><div class="trow"><span>Chiết khấu:</span><span>'+fmtMoney(d.discount||0)+'</span></div><div class="trow grand"><span>Tổng tiền:</span><span>'+fmtMoney(docTotal(d))+"</span></div></div>"+
 (d.kind==="order"?'<div class="section-title">Báo giá</div>'+(srcQuote?'<div style="font-size:13.5px">Đơn này tạo từ báo giá <b>'+esc(srcQuote.code)+"</b> · "+fmtMoney(docTotal(srcQuote))+' <button class="btn sm" onclick="quoteQuickView(\''+srcQuote.id+'\')">Xem báo giá</button> <button class="btn sm" onclick="printDoc(\''+srcQuote.id+'\')">In báo giá</button></div>':'<div style="font-size:13.5px;color:var(--muted)">Đơn này không tạo từ báo giá có sẵn.</div>')+
  childQuotes.map(q=>'<div style="font-size:13.5px;margin-top:6px">Báo giá lập từ đơn này: <b>'+esc(q.code)+"</b> · "+fmtMoney(docTotal(q))+' <button class="btn sm" onclick="quoteQuickView(\''+q.id+'\')">Xem</button></div>').join("")+
  '<div style="margin-top:8px"><button class="btn sm" onclick="convertAndOpen(\''+d.id+'\',\'quote\')">Lập báo giá từ đơn này</button></div>'+
  '<div class="section-title">Hóa đơn nội bộ</div>'+(invoices.length?invoices.map(inv=>'<div style="font-size:13.5px;margin-bottom:6px"><b>'+esc(inv.code)+"</b> · "+fmtDate(inv.date)+" · "+fmtMoney(docTotal(inv))+" "+docBadge(inv)+' <button class="btn sm" onclick="docDetail(\''+inv.id+'\')">Xem</button> <button class="btn sm" onclick="printDoc(\''+inv.id+'\')">In A5</button></div>').join(""):'<div style="font-size:13.5px;color:var(--muted)">Chưa xuất hóa đơn cho đơn này.</div>')+
  (exportTx?'<div class="section-title">Phiếu xuất kho</div><div style="font-size:13.5px">Phiếu <b>'+esc(exportTx.code)+"</b> · "+txStatusBadge(exportTx.status)+" · chở hàng: "+(exportTx.status==="approved"?deliveryBadge(exportTx.deliveryStatus):"—")+' <button class="btn sm" onclick="closeModal();go(\'export\');setTimeout(()=>txDetail(\''+exportTx.id+'\'),50)">Mở phiếu</button></div>':""):"")+
 (d.kind==="invoice"?'<div style="font-size:12.5px;color:var(--muted);margin-top:14px">Hóa đơn nội bộ — chỉ dùng trong quản lý nội bộ, không dùng để kê khai thuế (thuế kê khai trên Misa riêng).</div>':"")+
 '</div><div class="mfoot">'+actions+'<button class="btn" onclick="printDoc(\''+d.id+'\')">In '+(d.kind==="invoice"?"A5":"chứng từ")+'</button><button class="btn" onclick="closeModal()">Đóng</button></div>',true)}
function convertAndOpen(id,target){const nd=convertDoc(id,target);if(nd){render();if(target==="invoice"){printDoc(nd.id)}else docDetail(nd.id)}}
function createExportFromOrder(id){const d=DB.docs.find(x=>x.id===id);
 if(d.exportTxId){toast("Đơn này đã có phiếu xuất.",true);return}
 if(!DB.warehouses.length){toast("Cần tạo kho hàng trước.",true);return}
 openModal(mHead("Tạo phiếu xuất kho từ đơn "+d.code)+'<form id="expForm"><div class="mbody"><div class="fgrid">'+
 '<div class="field"><label>Kho xuất *</label><select id="exf-wh">'+DB.warehouses.map(w=>'<option value="'+w.id+'">'+esc(w.code+" — "+w.name)+"</option>").join("")+"</select></div>"+
 '<div class="field"><label>Ngày xuất</label><input id="exf-date" type="date" value="'+todayStr()+'"></div>'+
 '</div><p style="font-size:13px;color:var(--muted)">Phiếu xuất được tạo ở trạng thái <b>chờ duyệt</b> — duyệt phiếu ở mục Xuất kho thì mới trừ tồn, tính công nợ và theo dõi chở hàng.</p></div>'+
 '<div class="mfoot"><button type="button" class="btn" onclick="docDetail(\''+d.id+'\')">Quay lại</button><button class="btn primary" type="submit">Tạo phiếu xuất</button></div></form>');
 $("#expForm").addEventListener("submit",e=>{e.preventDefault();
  const tx={id:uid(),code:nextCode("PX"),type:"export",status:"draft",date:$("#exf-date").value,warehouseId:$("#exf-wh").value,toWarehouseId:"",partnerId:d.partnerId,note:"Xuất theo đơn "+d.code,paidAmount:0,deliveryStatus:"pending",deliveredAt:"",vehicle:"",driver:"",deliveryNote:"",lines:d.lines.map(l=>({productId:l.productId,qty:l.qty,unit:l.unit,price:l.price}))};
  DB.txs.unshift(tx);d.exportTxId=tx.id;if(d.status==="confirmed"||d.status==="draft")d.status="fulfilled";
  logAct("Tạo phiếu xuất từ đơn hàng",d.code+" → "+tx.code);save();closeModal();render();toast("Đã tạo phiếu xuất "+tx.code+" (chờ duyệt).")})}
/* ================= Debts ================= */
function vDebts(r){let totRec=0,totPay=0;const prows=[];
 DB.partners.forEach(p=>{const d=partnerDebt(p.id);if(d.receivable>0||d.payable>0){totRec+=Math.max(0,d.receivable);totPay+=Math.max(0,d.payable);prows.push({p,d})}});
 const card=(l,v,c)=>'<div class="card stat '+(c||"")+'"><div class="sl">'+l+'</div><div class="sv">'+v+"</div></div>";
 r.innerHTML='<div class="grid stat-grid" style="margin-bottom:14px">'+card("Tổng khách còn nợ",fmtMoney(totRec),"danger")+card("Tổng còn nợ nhà cung cấp",fmtMoney(totPay),"warn")+"</div>"+
 '<div class="card"><div class="chead">Công nợ theo đối tượng</div><div class="cbody"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mã</th><th>Đối tượng</th><th>Loại</th><th class="num">Khách còn nợ</th><th class="num">Còn nợ NCC</th><th></th></tr></thead><tbody>'+
 (prows.map(x=>'<tr><td><b>'+esc(x.p.code)+'</b></td><td>'+esc(x.p.name)+'</td><td>'+(x.p.type==='customer'?'Khách hàng':x.p.type==='supplier'?'Nhà cung cấp':'Cả hai')+'</td><td class="num">'+(x.d.receivable>0?'<b style="color:#dc2626">'+fmtMoney(x.d.receivable)+'</b>':'—')+'</td><td class="num">'+(x.d.payable>0?fmtMoney(x.d.payable):'—')+'</td><td><div class="row-actions"><button class="btn sm" onclick="debtDetail(\''+x.p.id+'\')">Chi tiết</button> <button class="btn sm primary" onclick="paymentForm(\''+x.p.id+'\')">Ghi thu / chi</button></div></td></tr>').join('')||'<tr><td colspan="6"><div class="empty">Chưa có công nợ nào. Công nợ phát sinh từ phiếu nhập/xuất đã duyệt.</div></td></tr>')+
 "</tbody></table></div></div></div>";
 $$("[data-debt]").forEach(b=>b.addEventListener("click",()=>debtDetail(b.dataset.debt)));
 $$("[data-pay]").forEach(b=>b.addEventListener("click",()=>paymentForm(b.dataset.pay)))}
function debtDetail(pid){const p=partnerById(pid);const d=partnerDebt(pid);
 const txs=DB.txs.filter(t=>t.partnerId===pid&&t.status==="approved"&&(t.type==="export"||t.type==="import"));
 const pays=DB.payments.filter(x=>x.partnerId===pid);
 openModal(mHead("Công nợ — "+p.name)+'<div class="mbody"><div class="kv">'+
 '<div><div class="k">Khách còn nợ (phải thu)</div><div class="v">'+fmtMoney(Math.max(0,d.receivable))+'</div></div>'+
 '<div><div class="k">Còn nợ NCC (phải trả)</div><div class="v">'+fmtMoney(Math.max(0,d.payable))+"</div></div></div>"+
 '<div class="section-title">Phiếu còn nợ</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phiếu</th><th>Ngày</th><th>Loại</th><th class="num">Tổng</th><th class="num">Đã trả</th><th class="num">Còn nợ</th></tr></thead><tbody>'+
 (txs.filter(t=>txTotal(t)-(Number(t.paidAmount)||0)>0).map(t=>"<tr><td><b>"+esc(t.code)+"</b></td><td>"+fmtDate(t.date)+"</td><td>"+(t.type==="export"?"Xuất (khách nợ)":"Nhập (nợ NCC)")+'</td><td class="num">'+fmtMoney(txTotal(t))+'</td><td class="num">'+fmtMoney(t.paidAmount||0)+'</td><td class="num"><b>'+fmtMoney(txTotal(t)-(Number(t.paidAmount)||0))+"</b></td></tr>").join("")||'<tr><td colspan="6"><div class="empty">Không có phiếu còn nợ.</div></td></tr>')+
 '</tbody></table></div><div class="section-title">Lịch sử thu / chi</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày</th><th>Loại</th><th class="num">Số tiền</th><th>Hình thức</th><th>Ghi chú</th><th></th></tr></thead><tbody>'+
 (pays.map(pm=>"<tr><td>"+fmtDate(pm.date)+"</td><td>"+(pm.kind==="receipt"?"Thu tiền khách":"Chi trả NCC")+'</td><td class="num">'+fmtMoney(pm.amount)+"</td><td>"+(pm.method==="cash"?"Tiền mặt":pm.method==="bank"?"Chuyển khoản":"Khác")+"</td><td>"+esc(pm.note||"")+'</td><td><div class="row-actions"><button class="abtn red" onclick="deletePayment(\''+pm.id+"')\">"+TRASH+"</button></div></td></tr>").join("")||'<tr><td colspan="6"><div class="empty">Chưa có lần thu/chi nào.</div></td></tr>')+
 '</tbody></table></div></div><div class="mfoot"><button class="btn primary" onclick="paymentForm(\''+pid+'\')">Ghi thu / chi</button><button class="btn" onclick="closeModal()">Đóng</button></div>',true)}
function paymentForm(pid){const p=partnerById(pid);const d=partnerDebt(pid);
 openModal(mHead("Ghi thu / chi — "+p.name)+'<form id="payForm"><div class="mbody"><div class="fgrid">'+
 '<div class="field"><label>Loại</label><select id="payf-kind"><option value="receipt">Thu tiền khách trả</option><option value="payment">Chi trả nhà cung cấp</option></select><div class="hint">Hiện còn nợ: khách nợ '+fmtMoney(Math.max(0,d.receivable))+" · nợ NCC "+fmtMoney(Math.max(0,d.payable))+"</div></div>"+
 '<div class="field"><label>Ngày</label><input id="payf-date" type="date" value="'+todayStr()+'"></div>'+
 '<div class="field"><label>Số tiền *</label><input id="payf-amount" type="number" min="0" step="any" required></div>'+
 '<div class="field"><label>Hình thức</label><select id="payf-method"><option value="cash">Tiền mặt</option><option value="bank">Chuyển khoản</option><option value="other">Khác</option></select></div>'+
 '<div class="field full"><label>Ghi chú</label><input id="payf-note"></div></div></div>'+
 '<div class="mfoot"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" type="submit">Lưu phiếu thu / chi</button></div></form>');
 $("#payForm").addEventListener("submit",e=>{e.preventDefault();const kind=$("#payf-kind").value,amount=Number($("#payf-amount").value)||0;
  if(!(amount>0)){toast("Nhập số tiền hợp lệ.",true);return}
  const dd=partnerDebt(pid);const limit=kind==="receipt"?Math.max(0,dd.receivable):Math.max(0,dd.payable);
  if(amount>limit){toast("Số tiền vượt quá số còn nợ ("+fmtMoney(limit)+").",true);return}
  DB.payments.unshift({id:uid(),partnerId:pid,kind,amount,date:$("#payf-date").value,method:$("#payf-method").value,note:$("#payf-note").value.trim(),txId:""});
  logAct(kind==="receipt"?"Ghi thu tiền":"Ghi chi tiền",p.name+" · "+fmtMoney(amount));save();closeModal();render();debtDetail(pid);toast("Đã ghi "+(kind==="receipt"?"thu":"chi")+" "+fmtMoney(amount))})}
function deletePayment(id){const pm=DB.payments.find(x=>x.id===id);askConfirm("Xóa phiếu thu/chi","Xóa khoản "+fmtMoney(pm.amount)+" ngày "+fmtDate(pm.date)+"?",()=>{DB.payments=DB.payments.filter(x=>x.id!==id);logAct("Xóa thu/chi",fmtMoney(pm.amount));save();closeModal();render()})}
/* ================= Report / History / Templates / Admin / Settings ================= */
function vReport(r){const sm=stockMap();let stockVal=0;allProducts().forEach(p=>{let q=0;DB.warehouses.forEach(w=>q+=sm[w.id+"|"+p.id]||0);stockVal+=q*(Number(p.cost)||0)});
 const inRange=(t,from,to)=>t.status==="approved"&&(!from||t.date>=from)&&(!to||t.date<=to);
 const from=VIEWPARAM&&VIEWPARAM.from||"",to=VIEWPARAM&&VIEWPARAM.to||"";
 const imp=DB.txs.filter(t=>t.type==="import"&&inRange(t,from,to)).reduce((s,t)=>s+txTotal(t),0);
 const exp=DB.txs.filter(t=>t.type==="export"&&inRange(t,from,to)).reduce((s,t)=>s+txTotal(t),0);
 const whRows=DB.warehouses.map((w,i)=>{let q=0,val=0;allProducts().forEach(p=>{const s=sm[w.id+"|"+p.id]||0;q+=s;val+=s*(Number(p.cost)||0)});return{w,q,val}});
 const top=Object.entries(DB.txs.filter(t=>t.status==="approved"&&t.type==="export").reduce((m,t)=>{t.lines.forEach(l=>m[l.productId]=(m[l.productId]||0)+Number(l.qty));return m},{})).sort((a,b)=>b[1]-a[1]).slice(0,8);
 r.innerHTML='<div class="card"><div class="chead">Báo cáo</div><div class="cbody">'+
 '<div class="toolbar"><label style="font-size:12.5px">Từ ngày <input type="date" id="rpFrom" value="'+esc(from)+'" style="width:auto"></label><label style="font-size:12.5px">Đến ngày <input type="date" id="rpTo" value="'+esc(to)+'" style="width:auto"></label><button class="btn sm" onclick="applyReportRange()">Xem</button><button class="btn sm" onclick="VIEWPARAM=null;render()">Tất cả</button></div>'+
 '<div class="grid stat-grid"><div class="card stat green"><div class="sl">Tổng nhập (đã duyệt)</div><div class="sv">'+fmtMoney(imp)+'</div></div><div class="card stat"><div class="sl">Tổng xuất (đã duyệt)</div><div class="sv" style="color:#dc2626">'+fmtMoney(exp)+'</div></div><div class="card stat"><div class="sl">Giá trị tồn kho hiện tại</div><div class="sv">'+fmtMoney(stockVal)+"</div></div></div>"+
 '<div class="section-title">Tồn theo kho</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kho</th><th class="num">Tổng số lượng tồn</th><th class="num">Giá trị tồn</th></tr></thead><tbody>'+
 (whRows.map(x=>"<tr><td><b>"+esc(x.w.code)+"</b> — "+esc(x.w.name)+'</td><td class="num">'+fmtN(x.q)+'</td><td class="num">'+fmtMoney(x.val)+"</td></tr>").join("")||'<tr><td colspan="3"><div class="empty">Chưa có kho.</div></td></tr>')+
 '</tbody></table></div><div class="section-title">Sản phẩm xuất nhiều nhất</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sản phẩm</th><th class="num">Số lượng đã xuất</th></tr></thead><tbody>'+
 (top.map(([pid,q])=>{const p=prodById(pid);return "<tr><td>"+esc(p?p.code+" — "+p.name:pid)+'</td><td class="num">'+fmtN(q)+"</td></tr>"}).join("")||'<tr><td colspan="2"><div class="empty">Chưa có dữ liệu xuất kho.</div></td></tr>')+
 "</tbody></table></div></div></div>"}
function applyReportRange(){VIEWPARAM={from:$("#rpFrom").value,to:$("#rpTo").value};render()}

function saveTemplate(){const src=DB.docs.find(x=>x.id=== $("#tplSrc").value)||DB.txs.find(x=>x.id===$("#tplSrc").value);const name=$("#tplName").value.trim();
 if(!src||!name){toast("Chọn chứng từ và nhập tên mẫu.",true);return}
 DB.templates.unshift({id:uid(),name,kind:src.kind||src.type,note:"Từ "+src.code,lines:src.lines.map(l=>Object.assign({},l))});logAct("Lưu mẫu",name);save();closeModal();render();toast("Đã lưu mẫu.")}
function deleteTemplate(id){DB.templates=DB.templates.filter(x=>x.id!==id);save();render()}
function useTemplate(id){const t=DB.templates.find(x=>x.id===id);closeModal();
 if(t.kind==="order"||t.kind==="quote"){docForm(t.kind);setTimeout(()=>{formLines=t.lines.map(l=>Object.assign({},l,{name:prodById(l.productId)?.name||""}));renderLineRows("sales")},60)}
 else{txForm(t.kind);setTimeout(()=>{formLines=t.lines.map(l=>Object.assign({},l,{name:prodById(l.productId)?.name||""}));renderLineRows(t.kind)},60)}}
function vAdmin(r){
 r.innerHTML='<div class="card"><div class="chead">Quản trị — Tài khoản</div><div class="cbody">'+
 '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th></th></tr></thead><tbody>'+
 DB.users.map(u=>"<tr><td><b>"+esc(u.username)+"</b></td><td>"+esc(u.name)+"</td><td>"+(u.role==="admin"?"Quản trị viên":"Nhân viên")+'</td><td><div class="row-actions"><button class="abtn" onclick="userForm(\''+u.id+'\')">'+PEN+"</button>"+(u.username!=="admin"?'<button class="abtn red" onclick="deleteUser(\''+u.id+"')\">"+TRASH+"</button>":"")+"</div></td></tr>").join("")+
 '</tbody></table></div><button class="btn primary sm" style="margin-top:12px" onclick="userForm()">+ Thêm tài khoản</button>'+
 '<p style="font-size:12.5px;color:var(--muted)">Bản dùng thử: tài khoản chỉ có tác dụng trên máy này.</p></div></div>'}
function userForm(id){const u=id?DB.users.find(x=>x.id===id):null;
 openModal(mHead(u?"Sửa tài khoản":"Thêm tài khoản")+'<form id="uForm"><div class="mbody"><div class="fgrid">'+
 '<div class="field"><label>Họ tên *</label><input id="uf-name" value="'+esc(u?u.name:"")+'" required></div>'+
 '<div class="field"><label>Tên đăng nhập *</label><input id="uf-user" value="'+esc(u?u.username:"")+'" required></div>'+
 '<div class="field"><label>Mật khẩu *</label><input id="uf-pass" value="'+esc(u?u.password:"")+'" required></div>'+
 '<div class="field"><label>Vai trò</label><select id="uf-role"><option value="staff" '+(u&&u.role==="staff"?"selected":"")+'>Nhân viên</option><option value="admin" '+(u&&u.role==="admin"?"selected":"")+'>Quản trị viên</option></select></div>'+
 '</div></div><div class="mfoot"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" type="submit">Lưu</button></div></form>');
 $("#uForm").addEventListener("submit",e=>{e.preventDefault();const d={name:$("#uf-name").value.trim(),username:$("#uf-user").value.trim().toLowerCase(),password:$("#uf-pass").value,role:$("#uf-role").value};
  if(DB.users.some(x=>x.username===d.username&&x.id!==id)){toast("Tên đăng nhập đã tồn tại.",true);return}
  if(u)Object.assign(u,d);else DB.users.push(Object.assign({id:uid()},d));
  logAct(u?"Sửa tài khoản":"Thêm tài khoản",d.username);save();closeModal();render();toast("Đã lưu tài khoản.")})}
function deleteUser(id){const u=DB.users.find(x=>x.id===id);askConfirm("Xóa tài khoản","Xóa tài khoản "+u.username+"?",()=>{DB.users=DB.users.filter(x=>x.id!==id);save();render()})}
function vSettings(r){const s=DB.settings;
 r.innerHTML='<div class="card"><div class="chead">Cài đặt</div><div class="cbody"><form id="setForm"><div class="fgrid">'+
 '<div class="field full"><label>Tên công ty (in trên chứng từ)</label><input id="sf-company" value="'+esc(s.company)+'"></div>'+
 '<div class="field"><label>Địa chỉ</label><input id="sf-addr" value="'+esc(s.address)+'"></div>'+
 '<div class="field"><label>Điện thoại</label><input id="sf-phone" value="'+esc(s.phone)+'"></div>'+
 '<div class="field"><label>Mã số thuế</label><input id="sf-tax" value="'+esc(s.tax)+'"></div>'+
 '</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">Lưu cài đặt</button>'+
 '<button class="btn" type="button" onclick="resetTrial()">Đặt lại dữ liệu dùng thử</button></div>'+
 '<p style="font-size:12.5px;color:var(--muted)">“Đặt lại dữ liệu dùng thử” xóa toàn bộ phiếu, đơn hàng, công nợ đã nhập trên máy này (giữ nguyên 722 sản phẩm gốc) để bắt đầu thử lại từ đầu.</p></form></div></div>';
 $("#setForm").addEventListener("submit",e=>{e.preventDefault();DB.settings={company:$("#sf-company").value.trim(),address:$("#sf-addr").value.trim(),phone:$("#sf-phone").value.trim(),tax:$("#sf-tax").value.trim()};save();toast("Đã lưu cài đặt.")})}
function resetTrial(){askConfirm("Đặt lại dữ liệu dùng thử","Xóa toàn bộ dữ liệu đã nhập trên máy này và quay về trạng thái ban đầu?",()=>{const theme=DB.theme;DB=blankDB();DB.theme=theme;save();render();toast("Đã đặt lại dữ liệu dùng thử.")})}
/* ================= Printing ================= */
function sheetHead(title,code,dateStr){const s=DB.settings;
 return '<div class="co"><b>'+esc(s.company)+"</b>"+(s.address?"<br>"+esc(s.address):"")+(s.phone?"<br>Điện thoại: "+esc(s.phone):"")+(s.tax?" · MST: "+esc(s.tax):"")+"</div>"+
 '<h2>'+esc(title)+'</h2><div class="sub">Số: '+esc(code)+" &nbsp;·&nbsp; Ngày: "+fmtDate(dateStr)+"</div>"}
function linesTable(lines){return "<table><thead><tr><th style=\"width:36px\">STT</th><th>Tên hàng hóa</th><th style=\"width:70px\">ĐVT</th><th style=\"width:80px\">Số lượng</th><th style=\"width:110px\">Đơn giá</th><th style=\"width:120px\">Thành tiền</th></tr></thead><tbody>"+
 lines.map((l,i)=>{const p=prodById(l.productId);return "<tr><td class=\"c\">"+(i+1)+"</td><td>"+esc(p?p.name:"")+"</td><td class=\"c\">"+esc(l.unit||"")+'</td><td class="r">'+fmtN(l.qty)+'</td><td class="r">'+fmtN(l.price)+'</td><td class="r">'+fmtN(l.qty*l.price)+"</td></tr>"}).join("")+"</tbody></table>"}
function signsHTML(a,b,c){return '<div class="signs"><div><b>'+a+'</b><div class="sp"></div>(Ký, họ tên)</div><div><b>'+b+'</b><div class="sp"></div>(Ký, họ tên)</div><div><b>'+c+'</b><div class="sp"></div>(Ký, họ tên)</div></div>'}
function doPrint(){try{window.print()}catch(e){toast("Hãy dùng chức năng In của trình duyệt (Ctrl+P) để in chứng từ này.")}}
function printTx(id){const t=DB.txs.find(x=>x.id===id);if(!t)return;const tot=txTotal(t);
 const title=t.type==="import"?"Phiếu nhập kho":t.type==="export"?"Phiếu xuất kho":"Phiếu chuyển kho";
 $("#printArea").innerHTML='<style>@page{size:A4 portrait;margin:1.2cm}</style><div class="sheet">'+sheetHead(title,t.code,t.date)+
 '<div style="margin-bottom:8px">'+(t.type==="transfer"?"Kho đi: <b>"+esc(whById(t.warehouseId)?.name||"")+"</b> → Kho đến: <b>"+esc(whById(t.toWarehouseId)?.name||"")+"</b>":"Kho: <b>"+esc(whById(t.warehouseId)?.name||"")+"</b>")+
 (t.partnerId?" · Đối tượng: <b>"+esc(partnerById(t.partnerId)?.name||"")+"</b>":"")+(t.note?"<br>Ghi chú: "+esc(t.note):"")+"</div>"+
 linesTable(t.lines)+
 '<div style="text-align:right;margin-top:8px">Tổng tiền: <b>'+fmtN(tot)+" đ</b></div>"+
 '<div style="font-style:italic">Bằng chữ: '+esc(moneyWords(tot))+"</div>"+
 signsHTML("Người lập phiếu",t.type==="import"?"Người giao hàng":"Người nhận hàng","Thủ kho")+"</div>";
 doPrint()}
let docPaper={}; // per-doc A4/A5 choice
function printDoc(id){const d=DB.docs.find(x=>x.id===id);if(!d)return;
 const isInv=d.kind==="invoice";const paper=docPaper[id]||(isInv?"A5":"A4");
 const title=d.kind==="quote"?"Báo giá":d.kind==="order"?"Đơn đặt hàng":"Hóa đơn bán hàng (nội bộ)";
 const tot=docTotal(d);
 $("#printArea").innerHTML='<style>@page{size:'+paper+' portrait;margin:'+(paper==="A5"?"0.6cm":"1.2cm")+'}</style><div class="sheet'+(paper==="A5"?" a5":"")+'">'+sheetHead(title,d.code,d.date)+
 '<div style="margin-bottom:8px">Khách hàng: <b>'+esc(partnerById(d.partnerId)?.name||"Khách lẻ")+"</b>"+
 (partnerById(d.partnerId)?.phone?" · ĐT: "+esc(partnerById(d.partnerId).phone):"")+
 (d.kind==="quote"&&d.validUntil?"<br>Hiệu lực báo giá đến: "+fmtDate(d.validUntil):"")+
 (isInv?"<br><i>Hóa đơn nội bộ — không dùng để kê khai thuế.</i>":"")+"</div>"+
 linesTable(d.lines)+
 '<div style="text-align:right;margin-top:8px">'+((d.discount||0)>0?"Chiết khấu: <b>"+fmtN(d.discount)+" đ</b><br>":"")+'Tổng thanh toán: <b>'+fmtN(tot)+" đ</b></div>"+
 '<div style="font-style:italic">Bằng chữ: '+esc(moneyWords(tot))+"</div>"+
 signsHTML("Người lập",d.kind==="invoice"?"Khách hàng":"Khách hàng","Giám đốc")+
 '<div style="margin-top:14px;display:flex;gap:8px;justify-content:center" class="noprint"></div></div>'+
 '<div class="print-controls" style="text-align:center;margin-top:10px;font-family:Inter,sans-serif;font-size:12px">Khổ giấy: <button onclick="setDocPaper(\''+id+'\',\'A5\')">A5</button> <button onclick="setDocPaper(\''+id+'\',\'A4\')">A4</button> — chọn xong bấm In của trình duyệt (Ctrl+P) hoặc nút In bên dưới. <button onclick="doPrint()">In ngay</button></div>';
 toast("Đã mở bản in "+d.code+" (khổ "+paper+"). Bấm Ctrl+P hoặc nút In ngay trong bản in nếu chưa thấy hộp thoại in.");doPrint()}
function setDocPaper(id,paper){docPaper[id]=paper;printDoc(id)}
